name: Deploy AMBOSS QBank to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Rebuild the exact HTML page
        run: |
          set -eu
          mkdir -p _site
          gzip -dc AMBOSSQBank.html.gz > _site/index.html
          cp manus-routes.json _site/manus-routes.json
          touch _site/.nojekyll
          test -s _site/index.html
          test "$(stat -c %s _site/index.html)" -lt 1073741824
          sha256sum _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
